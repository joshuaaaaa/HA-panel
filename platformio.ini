; HA-Panel - Home Assistant LED matrix firmware
; Build + flash:   pio run -e esp32-s3 -t upload
; Serial monitor:  pio device monitor
; OTA (network):   pio run -e esp32-s3 -t upload --upload-port hapanel-xxxxxx.local

[platformio]
default_envs = esp32-s3

[env]
platform = espressif32@6.9.0          ; Arduino core 2.0.17
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.filesystem = littlefs
extra_scripts = pre:tools/embed_web.py
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  makuna/NeoPixelBus@2.8.3
  esp32async/ESPAsyncWebServer@^3.7.2
  esp32async/AsyncTCP@^3.4.0
  knolleary/PubSubClient@^2.8
  links2004/WebSockets@^2.6.1
build_flags =
  -DCORE_DEBUG_LEVEL=0

; ---------------------------------------------------------------------------
; RECOMMENDED: ESP32-S3 DevKitC-1 (N8R2 / N16R8 / N8 ...), LED data on GPIO14
[env:esp32-s3]
board = esp32-s3-devkitc-1
; 4 MB layout works on every S3 module (4/8/16 MB flash, with or without PSRAM)
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
; native USB: serial log goes to the same USB port that is used for flashing
build_flags = ${env.build_flags} -DDEFAULT_LED_PIN=14 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; Classic ESP32 DevKit (ESP32-WROOM-32, 4 MB flash), LED data on GPIO16
[env:esp32dev]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags = ${env.build_flags} -DDEFAULT_LED_PIN=16

; ESP32-C3 (SuperMini / DevKitM), single core - works, but S3/ESP32 is smoother
[env:esp32-c3]
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags = ${env.build_flags} -DDEFAULT_LED_PIN=5 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; Ulanzi TC001 pixel clock (replaces AWTRIX): matrix GPIO32, LDR GPIO35, buttons 26/27/14
[env:ulanzi-tc001]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags = ${env.build_flags} -DDEFAULT_LED_PIN=32 -DHW_ULANZI
