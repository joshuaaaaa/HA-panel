; HA-Panel - Home Assistant LED matrix firmware
; Build + flash:   pio run -e esp32 -t upload
; Serial monitor:  pio device monitor
; OTA (network):   pio run -e esp32 -t upload --upload-port hapanel-xxxxxx.local

[platformio]
default_envs = esp32

[env]
platform = espressif32@6.9.0          ; Arduino core 2.0.17
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.filesystem = littlefs
extra_scripts = pre:tools/embed_web.py
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  makuna/NeoPixelBus@2.8.3
  esp32async/ESPAsyncWebServer@^3.7.2
  esp32async/AsyncTCP@^3.4.0
  knolleary/PubSubClient@^2.8
  links2004/WebSockets@^2.6.1
build_flags =
  -DCORE_DEBUG_LEVEL=0

; ---------------------------------------------------------------------------
; ESP32 (WROOM-32 DevKit) with AWTRIX 3 DIY wiring:
; matrix GPIO32, matrix layout 0 (rows, zigzag), buttons GPIO26 / 27 / 14
[env:esp32]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags = ${env.build_flags} -DDEFAULT_LED_PIN=32 -DHW_AWTRIX

; Ulanzi TC001 pixel clock (AWTRIX hardware): as above + LDR GPIO35, buzzer muted
[env:ulanzi-tc001]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags = ${env.build_flags} -DDEFAULT_LED_PIN=32 -DHW_ULANZI

; ESP32-S3 (any module, 4 MB layout), LED data on GPIO14, log over native USB
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
build_flags = ${env.build_flags} -DDEFAULT_LED_PIN=14 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3 (SuperMini / DevKitM), single core
[env:esp32-c3]
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags = ${env.build_flags} -DDEFAULT_LED_PIN=5 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
